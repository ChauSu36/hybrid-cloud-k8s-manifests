apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gcp-monitoring-ingress
  namespace: monitoring
  annotations:
    # Mở rộng kích thước gói tin đón batch Remote Write từ Prometheus Agent
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
  # 1. Endpoint đón Prometheus Remote Write từ OpenStack On-premise đẩy lên
  - host: metrics.chausu.name.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gcp-monitoring-kube-promet-prometheus
            port:
              number: 9090

  # 2. Truy cập Web Dashboard Grafana trung tâm
  - host: grafana.chausu.name.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gcp-monitoring-grafana
            port:
              number: 80
