apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gcp-logging-ingress
  namespace: logging
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
  # 1. Endpoint đón Log HTTPS từ Fluent Bit On-premise gửi lên
  - host: logs.chausu.name.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: elasticsearch
            port:
              number: 9200
  # 2. Giao diện Web UI Kibana cho kỹ sư truy cập
  - host: kibana.chausu.name.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601
