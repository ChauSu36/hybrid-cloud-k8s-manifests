apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-tsdb-pvc
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: "gcp-gke"

    storage:
      tsdb:
        out_of_order_time_window: 24h

    scrape_configs:
      - job_name: 'prometheus-self'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'gke-node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter-svc
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      - job_name: 'gke-kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics-svc.monitoring.svc.cluster.local:8080']

      - job_name: 'gke-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: central-prometheus
  namespace: monitoring
spec:
  serviceName: central-prometheus-svc
  replicas: 1
  selector:
    matchLabels:
      app: central-prometheus
  template:
    metadata:
      labels:
        app: central-prometheus
    spec:
      serviceAccountName: prometheus-scraper
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-vol
              mountPath: /etc/prometheus
            - name: tsdb-storage
              mountPath: /prometheus
      volumes:
        - name: config-vol
          configMap:
            name: prometheus-server-conf
        - name: tsdb-storage
          persistentVolumeClaim:
            claimName: prometheus-tsdb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: central-prometheus-svc
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: central-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
