apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-store
  nfs:
    path: /srv/nfs/mysql-data
    server: 192.168.100.178   # IP nội bộ của k8s-worker-2 (nơi cài NFS Server)
