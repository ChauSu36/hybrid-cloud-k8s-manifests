apiVersion: v1
kind: ConfigMap
metadata:
  name: jobportal-backend-config
  namespace: jobportal
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/jobportal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "jobportal_user"
  CORS_ALLOWED_ORIGINS: "https://k8s-onpremise.chausu.name.vn"
  APP_FRONTEND_URL: "https://k8s-onpremise.chausu.name.vn"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-backend
  namespace: jobportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobportal-backend
  template:
    metadata:
      labels:
        app: jobportal-backend
    spec:
      containers:
      - name: jobportal-backend
        image: chausu/jobportal-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: jobportal-backend-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: jobportal-backend-service
  namespace: jobportal
spec:
  selector:
    app: jobportal-backend
  ports:
  - port: 8080
    targetPort: 8080
