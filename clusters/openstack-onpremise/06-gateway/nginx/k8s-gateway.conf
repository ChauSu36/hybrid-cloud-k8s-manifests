upstream k8s_worker_cluster {
    least_conn;
    server 192.168.100.55:30080 max_fails=3 fail_timeout=10s;
    server 192.168.100.178:30080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name k8s-onpremise.chausu.name.vn api.chausu.name.vn;

    location / {
        proxy_pass http://k8s_worker_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
