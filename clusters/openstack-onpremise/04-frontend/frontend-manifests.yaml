apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-frontend
  namespace: jobportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobportal-frontend
  template:
    metadata:
      labels:
        app: jobportal-frontend
    spec:
      containers:
      - name: jobportal-frontend
        image: chausu/jobportal-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: jobportal-frontend-service
  namespace: jobportal
spec:
  selector:
    app: jobportal-frontend
  ports:
  - port: 80
    targetPort: 80
