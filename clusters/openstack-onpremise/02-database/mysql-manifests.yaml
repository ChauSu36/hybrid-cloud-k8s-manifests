apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: jobportal
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "MatKhau123@"
  MYSQL_DATABASE: "jobportal"
  MYSQL_USER: "jobportal_user"
  MYSQL_PASSWORD: "MatKhau123@"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: jobportal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-store
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: jobportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:
            name: mysql-secret
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: jobportal
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
