# ==========================================
# 1. INGRESS DÀNH CHO FRONTEND
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobportal-frontend-ingress
  namespace: jobportal
spec:
  ingressClassName: nginx
  rules:
  # 1.1 Tên miền chính thức của web
  - host: www.chausu.name.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jobportal-frontend-service
            port:
              number: 80

---
# ==========================================
# 2. INGRESS DÀNH CHO BACKEND (KÈM CORS ĐẦY ĐỦ)
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobportal-backend-ingress
  namespace: jobportal
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # Cho phép cả 2 domain Frontend gọi chéo API
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://www.chausu.name.vn"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "1728000"

    # --- THUẬT TOÁN TOKEN BUCKET / LEAKY BUCKET RATE LIMITING ---
    # Tốc độ nạp token trung bình r (50 req/s)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    # Dung lượng xô bùng nổ W = limit-rps * 2 = 100 tokens
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # Trả về mã lỗi chuẩn HTTP 429 (Too Many Requests) khi cạn token
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req_status 429;
spec:
  ingressClassName: nginx
  rules:
  - host: api.chausu.name.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jobportal-backend-service
            port:
              number: 8080
