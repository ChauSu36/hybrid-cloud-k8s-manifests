apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-frontend-deployment
  labels:
    app: jobportal-frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jobportal-frontend
  template:
    metadata:
      labels:
        app: jobportal-frontend
    spec:
      containers:
      - name: jobportal-frontend
        image: /jobportal-frontend:33db16305ad0817de886dd3da3842a78bc7f0c29
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "chmod -R 755 /usr/share/nginx/html/assets"]
