apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-agent
  namespace: monitoring
  labels:
    app: ai-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-sre-agent
  template:
    metadata:
      labels:
        app: ai-sre-agent
    spec:
      serviceAccountName: ai-sre-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: ai-sre-agent
        image: chausu/k8s-ai-sre-agent:v4
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: ai-sre-config
        - secretRef:
              name: ai-sre-secret
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
