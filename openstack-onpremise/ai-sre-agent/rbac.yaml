apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-agent-sa
  namespace: jobportal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-agent-role
  namespace: jobportal
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-agent-binding
  namespace: jobportal
subjects:
- kind: ServiceAccount
  name: ai-sre-agent-sa
  namespace: jobportal
roleRef:
  kind: Role
  name: ai-sre-agent-role
  apiGroup: rbac.authorization.k8s.io
